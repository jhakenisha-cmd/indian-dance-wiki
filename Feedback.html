				<input type="radio" name="helpful" value="yes"> Yes
				<input type="radio" name="helpful" value="no"> No

				<input type="checkbox" name="updates"> I would like to receive updates on new dance 					articles.
			  </p>
			  <p>
				<label>Any suggestions for us?</label><br>
				<textarea name="comments" rows="5" style="width: 80%; padding: 5px;"></textarea>
			  </p>
			  <input type="submit" value="Submit Feedback" style="background-color: maroon; color: white; 				  padding:10px 20px; border: none; cursor: pointer;">
			  </font>
